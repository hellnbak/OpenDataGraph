replicaCount: 2

image:
  repository: opendatagraph
  tag: "1.7.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: opendatagraph.example.invalid
      paths:
        - path: /
          pathType: Prefix
  tls: []

secretName: opendatagraph-runtime

config:
  environment: production
  defaultTenant: default
  autoSeedDemo: "false"
  authDisabled: "false"
  classificationMode: metadata
  searchBackend: opensearch
  opensearchRequired: "true"
  evidenceBackend: s3
  evidencePrefix: evidence
  githubAllowedHosts: api.github.com
  gitlabAllowedHosts: gitlab.com
  sharepointAllowedHosts: graph.microsoft.com
  connectorPluginAllowlist: ""
  connectorCapabilityPolicyJson: "{}"
  integrationAllowedHosts: ""
  integrationTimeoutSeconds: "10"
  oidcDiscoveryCacheSeconds: "3600"
  oidcHttpTimeoutSeconds: "5"
  workloadIdentityMaxTokenSeconds: "3600"
  workloadExchangeHttpTimeoutSeconds: "10"
  scimBulkMaxOperations: "100"
  serviceAccountCredentialDays: "90"
  serviceAccountRotationGraceHours: "24"
  serviceAccountStaleDays: "30"
  evidenceDefaultRetentionDays: "365"
  evidenceDispositionApprovalRequired: "true"
  workerScheduleBatchSize: "50"
  graphMaxDepth: "5"
  graphMaxExportEdges: "10000"
  graphAsyncExportMaxEdges: "250000"
  graphExportMaxBytes: "104857600"
  graphExportBackend: s3
  graphExportPrefix: graph-exports
  graphExportEndpointUrl: ""
  graphExportRegion: ""
  graphExportAllowedSinkBuckets: ""
  graphExportS3ExchangeProfile: ""
  graphExportGcsAllowedSinkBuckets: ""
  graphExportGcsExchangeProfile: ""
  graphExportAzureAllowedSinks: ""
  graphExportAzureExchangeProfile: ""
  graphExportHttpsAllowedHosts: ""
  graphExportHttpsTimeoutSeconds: "30"
  governanceDefaultSlaHours: "48"
  governanceDueSoonHours: "24"
  governancePackageBackend: s3
  governancePackagePrefix: governance-packages
  governancePackageEndpointUrl: ""
  governancePackageRegion: ""
  governancePackageMaxBytes: "104857600"
  governancePackageDefaultSigningProfile: ""
  governancePackageSigningRequired: "false"
  cosignExecutable: cosign
  cosignTimeoutSeconds: "60"
  logFormat: json
  metricsEnabled: "true"
  workerPollSeconds: "2"
  workerClaimTimeoutSeconds: "900"

worker:
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

workloadIdentityToken:
  enabled: false
  audience: opendatagraph-export
  expirationSeconds: 3600
  mountDirectory: /run/secrets/opendatagraph/workload
  fileName: token

workloadIdentityTokens: []

extraVolumes: []
extraVolumeMounts: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

nodeSelector: {}
tolerations: []
affinity: {}
