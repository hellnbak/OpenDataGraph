apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opendatagraph.fullname" . }}
  labels:
    {{- include "opendatagraph.labels" . | nindent 4 }}
data:
  ODG_ENVIRONMENT: {{ .Values.config.environment | quote }}
  ODG_AUTO_CREATE_SCHEMA: "false"
  ODG_AUTO_SEED_DEMO: {{ .Values.config.autoSeedDemo | quote }}
  ODG_DEFAULT_TENANT: {{ .Values.config.defaultTenant | quote }}
  ODG_AUTH_DISABLED: {{ .Values.config.authDisabled | quote }}
  ODG_CLASSIFICATION_MODE: {{ .Values.config.classificationMode | quote }}
  ODG_SEARCH_BACKEND: {{ .Values.config.searchBackend | quote }}
  ODG_OPENSEARCH_REQUIRED: {{ .Values.config.opensearchRequired | quote }}
  ODG_EVIDENCE_BACKEND: {{ .Values.config.evidenceBackend | quote }}
  ODG_EVIDENCE_PREFIX: {{ .Values.config.evidencePrefix | quote }}
  ODG_SECRET_FILE_ROOTS: "/run/secrets"
  ODG_GITHUB_ALLOWED_HOSTS: {{ .Values.config.githubAllowedHosts | quote }}
  ODG_GITLAB_ALLOWED_HOSTS: {{ .Values.config.gitlabAllowedHosts | quote }}
  ODG_SHAREPOINT_ALLOWED_HOSTS: {{ .Values.config.sharepointAllowedHosts | quote }}
  ODG_INTEGRATION_ALLOWED_HOSTS: {{ .Values.config.integrationAllowedHosts | quote }}
  ODG_INTEGRATION_TIMEOUT_SECONDS: {{ .Values.config.integrationTimeoutSeconds | quote }}
  ODG_OIDC_DISCOVERY_CACHE_SECONDS: {{ .Values.config.oidcDiscoveryCacheSeconds | quote }}
  ODG_OIDC_HTTP_TIMEOUT_SECONDS: {{ .Values.config.oidcHttpTimeoutSeconds | quote }}
  ODG_WORKLOAD_IDENTITY_MAX_TOKEN_SECONDS: {{ .Values.config.workloadIdentityMaxTokenSeconds | quote }}
  ODG_SCIM_BULK_MAX_OPERATIONS: {{ .Values.config.scimBulkMaxOperations | quote }}
  ODG_SERVICE_ACCOUNT_CREDENTIAL_DAYS: {{ .Values.config.serviceAccountCredentialDays | quote }}
  ODG_SERVICE_ACCOUNT_ROTATION_GRACE_HOURS: {{ .Values.config.serviceAccountRotationGraceHours | quote }}
  ODG_SERVICE_ACCOUNT_STALE_DAYS: {{ .Values.config.serviceAccountStaleDays | quote }}
  ODG_EVIDENCE_DEFAULT_RETENTION_DAYS: {{ .Values.config.evidenceDefaultRetentionDays | quote }}
  ODG_EVIDENCE_DISPOSITION_APPROVAL_REQUIRED: {{ .Values.config.evidenceDispositionApprovalRequired | quote }}
  ODG_WORKER_SCHEDULE_BATCH_SIZE: {{ .Values.config.workerScheduleBatchSize | quote }}
  ODG_GRAPH_MAX_DEPTH: {{ .Values.config.graphMaxDepth | quote }}
  ODG_GRAPH_MAX_EXPORT_EDGES: {{ .Values.config.graphMaxExportEdges | quote }}
  ODG_GRAPH_ASYNC_EXPORT_MAX_EDGES: {{ .Values.config.graphAsyncExportMaxEdges | quote }}
  ODG_GRAPH_EXPORT_MAX_BYTES: {{ .Values.config.graphExportMaxBytes | quote }}
  ODG_GRAPH_EXPORT_BACKEND: {{ .Values.config.graphExportBackend | quote }}
  ODG_GRAPH_EXPORT_PREFIX: {{ .Values.config.graphExportPrefix | quote }}
  ODG_GRAPH_EXPORT_ENDPOINT_URL: {{ .Values.config.graphExportEndpointUrl | quote }}
  ODG_GRAPH_EXPORT_REGION: {{ .Values.config.graphExportRegion | quote }}
  ODG_GRAPH_EXPORT_ALLOWED_SINK_BUCKETS: {{ .Values.config.graphExportAllowedSinkBuckets | quote }}
  ODG_GRAPH_EXPORT_HTTPS_ALLOWED_HOSTS: {{ .Values.config.graphExportHttpsAllowedHosts | quote }}
  ODG_GRAPH_EXPORT_HTTPS_TIMEOUT_SECONDS: {{ .Values.config.graphExportHttpsTimeoutSeconds | quote }}
  {{- if .Values.workloadIdentityToken.enabled }}
  ODG_GRAPH_EXPORT_HTTPS_IDENTITY_TOKEN_FILE: {{ printf "%s/%s" .Values.workloadIdentityToken.mountDirectory .Values.workloadIdentityToken.fileName | quote }}
  {{- end }}
  ODG_GOVERNANCE_DEFAULT_SLA_HOURS: {{ .Values.config.governanceDefaultSlaHours | quote }}
  ODG_GOVERNANCE_DUE_SOON_HOURS: {{ .Values.config.governanceDueSoonHours | quote }}
  ODG_GOVERNANCE_PACKAGE_BACKEND: {{ .Values.config.governancePackageBackend | quote }}
  ODG_GOVERNANCE_PACKAGE_PREFIX: {{ .Values.config.governancePackagePrefix | quote }}
  ODG_GOVERNANCE_PACKAGE_ENDPOINT_URL: {{ .Values.config.governancePackageEndpointUrl | quote }}
  ODG_GOVERNANCE_PACKAGE_REGION: {{ .Values.config.governancePackageRegion | quote }}
  ODG_GOVERNANCE_PACKAGE_MAX_BYTES: {{ .Values.config.governancePackageMaxBytes | quote }}
  ODG_LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  ODG_METRICS_ENABLED: {{ .Values.config.metricsEnabled | quote }}
  ODG_WORKER_POLL_SECONDS: {{ .Values.config.workerPollSeconds | quote }}
  ODG_WORKER_CLAIM_TIMEOUT_SECONDS: {{ .Values.config.workerClaimTimeoutSeconds | quote }}
