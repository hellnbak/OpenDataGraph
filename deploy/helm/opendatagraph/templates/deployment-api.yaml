apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opendatagraph.fullname" . }}
  labels:
    {{- include "opendatagraph.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "opendatagraph.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        app.kubernetes.io/name: {{ include "opendatagraph.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "opendatagraph.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "opendatagraph.fullname" . }}
            - secretRef:
                name: {{ .Values.secretName }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.workloadIdentityToken.enabled }}
            - name: workload-identity-token
              mountPath: {{ .Values.workloadIdentityToken.mountDirectory | quote }}
              readOnly: true
            {{- end }}
            {{- range .Values.workloadIdentityTokens }}
            - name: workload-identity-token-{{ .name }}
              mountPath: {{ .mountDirectory | quote }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.workloadIdentityToken.enabled }}
        - name: workload-identity-token
          projected:
            sources:
              - serviceAccountToken:
                  path: {{ .Values.workloadIdentityToken.fileName | quote }}
                  audience: {{ .Values.workloadIdentityToken.audience | quote }}
                  expirationSeconds: {{ .Values.workloadIdentityToken.expirationSeconds }}
        {{- end }}
        {{- range .Values.workloadIdentityTokens }}
        - name: workload-identity-token-{{ .name }}
          projected:
            sources:
              - serviceAccountToken:
                  path: {{ .fileName | quote }}
                  audience: {{ .audience | quote }}
                  expirationSeconds: {{ default 3600 .expirationSeconds }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
