services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opendatagraph
      POSTGRES_USER: opendatagraph
      POSTGRES_PASSWORD: ${ODG_POSTGRES_PASSWORD:?Set ODG_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendatagraph"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  opendatagraph:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ODG_DATABASE_URL: postgresql+psycopg://opendatagraph:${ODG_POSTGRES_PASSWORD}@postgres:5432/opendatagraph
      ODG_AUTO_SEED_DEMO: "true"
      ODG_CLASSIFICATION_MODE: hybrid
      ODG_OLLAMA_URL: http://host.docker.internal:11434
      ODG_OLLAMA_MODEL: qwen2.5:3b
      ODG_OPENSEARCH_URL: http://opensearch:9200
    volumes:
      - ~/.aws:/root/.aws:ro
      - ./secrets:/run/secrets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
  opensearch-data:
