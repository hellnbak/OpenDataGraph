services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opendatagraph
      POSTGRES_USER: opendatagraph
      POSTGRES_PASSWORD: ${ODG_POSTGRES_PASSWORD:?Set ODG_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendatagraph"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: &application-environment
      ODG_ENVIRONMENT: compose
      ODG_DATABASE_URL: postgresql+psycopg://opendatagraph:${ODG_POSTGRES_PASSWORD}@postgres:5432/opendatagraph
      ODG_AUTO_CREATE_SCHEMA: "false"
      ODG_AUTO_SEED_DEMO: ${ODG_AUTO_SEED_DEMO:-true}
      ODG_DEFAULT_TENANT: ${ODG_DEFAULT_TENANT:-default}
      ODG_AUTH_DISABLED: ${ODG_AUTH_DISABLED:-true}
      ODG_API_KEYS_JSON: ${ODG_API_KEYS_JSON:-"{}"}
      ODG_OIDC_PROVIDERS_JSON: ${ODG_OIDC_PROVIDERS_JSON:-"{}"}
      ODG_OIDC_DISCOVERY_CACHE_SECONDS: ${ODG_OIDC_DISCOVERY_CACHE_SECONDS:-3600}
      ODG_OIDC_HTTP_TIMEOUT_SECONDS: ${ODG_OIDC_HTTP_TIMEOUT_SECONDS:-5}
      ODG_SCIM_BEARER_TOKEN: ${ODG_SCIM_BEARER_TOKEN:-}
      ODG_SCIM_TOKENS_JSON: ${ODG_SCIM_TOKENS_JSON:-"{}"}
      ODG_SCIM_BULK_MAX_OPERATIONS: ${ODG_SCIM_BULK_MAX_OPERATIONS:-100}
      ODG_SERVICE_ACCOUNT_CREDENTIAL_DAYS: ${ODG_SERVICE_ACCOUNT_CREDENTIAL_DAYS:-90}
      ODG_SERVICE_ACCOUNT_ROTATION_GRACE_HOURS: ${ODG_SERVICE_ACCOUNT_ROTATION_GRACE_HOURS:-24}
      ODG_SERVICE_ACCOUNT_STALE_DAYS: ${ODG_SERVICE_ACCOUNT_STALE_DAYS:-30}
      ODG_CLASSIFICATION_MODE: ${ODG_CLASSIFICATION_MODE:-hybrid}
      ODG_OLLAMA_URL: ${ODG_OLLAMA_URL:-http://host.docker.internal:11434}
      ODG_OLLAMA_MODEL: ${ODG_OLLAMA_MODEL:-qwen2.5:3b}
      ODG_SEARCH_BACKEND: opensearch
      ODG_OPENSEARCH_URL: http://opensearch:9200
      ODG_OPENSEARCH_REQUIRED: "false"
      ODG_EVIDENCE_BACKEND: local
      ODG_EVIDENCE_LOCAL_DIRECTORY: /var/lib/opendatagraph/evidence
      ODG_EVIDENCE_DEFAULT_RETENTION_DAYS: ${ODG_EVIDENCE_DEFAULT_RETENTION_DAYS:-365}
      ODG_EVIDENCE_DISPOSITION_APPROVAL_REQUIRED: ${ODG_EVIDENCE_DISPOSITION_APPROVAL_REQUIRED:-false}
      ODG_SECRET_FILE_ROOTS: /run/secrets
      ODG_GITHUB_ALLOWED_HOSTS: ${ODG_GITHUB_ALLOWED_HOSTS:-api.github.com}
      ODG_GITLAB_ALLOWED_HOSTS: ${ODG_GITLAB_ALLOWED_HOSTS:-gitlab.com}
      ODG_SHAREPOINT_ALLOWED_HOSTS: ${ODG_SHAREPOINT_ALLOWED_HOSTS:-graph.microsoft.com}
      ODG_INTEGRATION_ALLOWED_HOSTS: ${ODG_INTEGRATION_ALLOWED_HOSTS:-}
      ODG_INTEGRATION_TIMEOUT_SECONDS: ${ODG_INTEGRATION_TIMEOUT_SECONDS:-10}
      ODG_WORKER_SCHEDULE_BATCH_SIZE: ${ODG_WORKER_SCHEDULE_BATCH_SIZE:-50}
      ODG_GRAPH_MAX_DEPTH: ${ODG_GRAPH_MAX_DEPTH:-5}
      ODG_GRAPH_MAX_EXPORT_EDGES: ${ODG_GRAPH_MAX_EXPORT_EDGES:-10000}
      ODG_GRAPH_ASYNC_EXPORT_MAX_EDGES: ${ODG_GRAPH_ASYNC_EXPORT_MAX_EDGES:-250000}
      ODG_GRAPH_EXPORT_MAX_BYTES: ${ODG_GRAPH_EXPORT_MAX_BYTES:-104857600}
      ODG_GRAPH_EXPORT_BACKEND: local
      ODG_GRAPH_EXPORT_LOCAL_DIRECTORY: /var/lib/opendatagraph/exports
      ODG_GRAPH_EXPORT_PREFIX: ${ODG_GRAPH_EXPORT_PREFIX:-graph-exports}
      ODG_GRAPH_EXPORT_ENDPOINT_URL: ${ODG_GRAPH_EXPORT_ENDPOINT_URL:-}
      ODG_GRAPH_EXPORT_REGION: ${ODG_GRAPH_EXPORT_REGION:-}
      ODG_GRAPH_EXPORT_ALLOWED_SINK_BUCKETS: ${ODG_GRAPH_EXPORT_ALLOWED_SINK_BUCKETS:-}
      ODG_GOVERNANCE_DEFAULT_SLA_HOURS: ${ODG_GOVERNANCE_DEFAULT_SLA_HOURS:-48}
      ODG_GOVERNANCE_DUE_SOON_HOURS: ${ODG_GOVERNANCE_DUE_SOON_HOURS:-24}
      ODG_LOG_FORMAT: json
      ODG_METRICS_ENABLED: "true"

  opendatagraph:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment: *application-environment
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready')"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - evidence-data:/var/lib/opendatagraph/evidence
      - graph-export-data:/var/lib/opendatagraph/exports
      - ~/.aws:/home/opendatagraph/.aws:ro
      - ./secrets:/run/secrets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
    environment: *application-environment
    restart: unless-stopped
    volumes:
      - evidence-data:/var/lib/opendatagraph/evidence
      - graph-export-data:/var/lib/opendatagraph/exports
      - ~/.aws:/home/opendatagraph/.aws:ro
      - ./secrets:/run/secrets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  evidence-data:
  graph-export-data:
  opensearch-data:
  postgres-data:
