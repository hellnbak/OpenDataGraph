name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ODG_DATABASE_URL=sqlite:////tmp/opendatagraph-ci.db alembic upgrade head
      - run: pytest -q
      - run: python -m compileall -q app connectors migrations mcp_server.py
      - run: ODG_POSTGRES_PASSWORD=ci-only docker compose config --quiet
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: software-bill-of-materials
          path: sbom.spdx.json
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: DOCKER_BUILDKIT=1 docker build -t opendatagraph:${{ github.sha }} .
      - run: docker run --rm -v "$PWD:/work" -w /work alpine/helm:3.18.4 lint deploy/helm/opendatagraph
      - run: docker run --rm -v "$PWD:/work" -w /work/deploy/aws hashicorp/terraform:1.12.2 fmt -check -recursive
